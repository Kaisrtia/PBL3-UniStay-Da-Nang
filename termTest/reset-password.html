<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — API Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .badge {
        display: inline-block;
        background: #1e3a5f;
        color: #60a5fa;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        border: 1px solid #2563eb44;
        margin-bottom: 0.5rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #f1f5f9;
      }

      .subtitle {
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 0.25rem;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .card-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .step-badge {
        background: #334155;
        color: #94a3b8;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
      }

      .method {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        font-family: monospace;
      }
      .post { background: #14532d; color: #4ade80; }
      .patch { background: #713f12; color: #fbbf24; }

      .url-display {
        font-size: 0.75rem;
        font-family: monospace;
        color: #64748b;
        background: #0f172a;
        padding: 0.4rem 0.6rem;
        border-radius: 6px;
        border: 1px solid #1e293b;
        word-break: break-all;
      }

      label {
        font-size: 0.8rem;
        color: #94a3b8;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      input, textarea {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        color: #e2e8f0;
        font-size: 0.875rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
        width: 100%;
      }

      input:focus, textarea:focus {
        border-color: #3b82f6;
      }

      input[readonly] {
        color: #475569;
        cursor: default;
      }

      .config-row {
        display: flex;
        gap: 0.5rem;
        align-items: flex-end;
      }

      .config-row label { flex: 1; }

      button {
        width: 100%;
        padding: 0.65rem 1rem;
        border: none;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
      }

      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      .btn-post  { background: #16a34a; color: #fff; }
      .btn-patch { background: #d97706; color: #fff; }
      .btn-post:hover:not(:disabled)  { background: #15803d; }
      .btn-patch:hover:not(:disabled) { background: #b45309; }

      .response-box {
        display: none;
        flex-direction: column;
        gap: 0.4rem;
      }

      .response-box.visible { display: flex; }

      .response-label {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .response-status {
        font-size: 0.75rem;
        font-weight: 600;
      }

      .response-body {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 0.8rem;
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 160px;
        overflow-y: auto;
        line-height: 1.5;
      }

      .ok    { color: #4ade80; }
      .error { color: #f87171; }

      .divider {
        border: none;
        border-top: 1px solid #1e293b;
      }

      .config-section {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 0.8rem;
        color: #64748b;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .config-section strong { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <span class="badge">API Test</span>
        <h1>Forgot Password</h1>
        <p class="subtitle">Test tool cho API quên mật khẩu — chạy bằng Live Server</p>
      </div>

      <!-- Base URL config -->
      <div class="config-section">
        <strong>⚙️ Backend URL</strong>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <input id="baseUrl" type="text" value="http://localhost:3000" style="flex:1;" />
        </div>
      </div>

      <!-- Step 1: Request reset link -->
      <div class="card">
        <div class="card-title">
          <span class="step-badge">STEP 1</span>
          <span class="method post">POST</span>
          Gửi link reset mật khẩu
        </div>
        <div class="url-display" id="url1">/api/v1/auth/forgot-password</div>

        <label>
          Email
          <input id="email" type="email" placeholder="user@example.com" />
        </label>

        <button class="btn-post" id="btn-send" onclick="sendResetLink()">
          Gửi link reset
        </button>

        <div class="response-box" id="res1">
          <div class="response-label">Response</div>
          <div class="response-status" id="res1-status"></div>
          <div class="response-body" id="res1-body"></div>
        </div>
      </div>

      <!-- Step 2: Reset password with token -->
      <div class="card">
        <div class="card-title">
          <span class="step-badge">STEP 2</span>
          <span class="method patch">PATCH</span>
          Đặt lại mật khẩu
        </div>
        <div class="url-display">/api/v1/auth/forgot-password</div>

        <label>
          Token (tự động đọc từ ?token= trên URL nếu có)
          <input id="token" type="text" placeholder="Paste token từ link email..." />
        </label>

        <label>
          Mật khẩu mới
          <input id="newPassword" type="password" placeholder="Nhập mật khẩu mới" />
        </label>

        <label>
          Xác nhận mật khẩu mới
          <input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu mới" />
        </label>

        <button class="btn-patch" id="btn-reset" onclick="resetPassword()">
          Đặt lại mật khẩu
        </button>

        <div class="response-box" id="res2">
          <div class="response-label">Response</div>
          <div class="response-status" id="res2-status"></div>
          <div class="response-body" id="res2-body"></div>
        </div>
      </div>
    </div>

    <script>
      // Auto-read token from URL query param
      const params = new URLSearchParams(window.location.search);
      const tokenFromUrl = params.get('token');
      if (tokenFromUrl) {
        document.getElementById('token').value = tokenFromUrl;
      }

      function getBase() {
        return document.getElementById('baseUrl').value.replace(/\/$/, '');
      }

      function showResponse(boxId, statusId, bodyId, status, data, ok) {
        const box = document.getElementById(boxId);
        box.classList.add('visible');
        const statusEl = document.getElementById(statusId);
        statusEl.textContent = `HTTP ${status}`;
        statusEl.className = 'response-status ' + (ok ? 'ok' : 'error');
        document.getElementById(bodyId).textContent = JSON.stringify(data, null, 2);
      }

      async function sendResetLink() {
        const email = document.getElementById('email').value.trim();
        if (!email) { alert('Nhập email đi bạn ơi 😅'); return; }

        const btn = document.getElementById('btn-send');
        btn.disabled = true;
        btn.textContent = 'Đang gửi...';

        try {
          const res = await fetch(`${getBase()}/api/v1/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          showResponse('res1', 'res1-status', 'res1-body', res.status, data, res.ok);
        } catch (err) {
          showResponse('res1', 'res1-status', 'res1-body', 'ERR', { error: err.message }, false);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Gửi link reset';
        }
      }

      async function resetPassword() {
        const token = document.getElementById('token').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!token) { alert('Cần có token!'); return; }
        if (!newPassword) { alert('Nhập mật khẩu mới đi!'); return; }
        if (newPassword !== confirmPassword) { alert('Mật khẩu xác nhận không khớp!'); return; }

        const btn = document.getElementById('btn-reset');
        btn.disabled = true;
        btn.textContent = 'Đang xử lý...';

        try {
          const res = await fetch(`${getBase()}/api/v1/auth/forgot-password`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
          });
          const data = await res.json();
          showResponse('res2', 'res2-status', 'res2-body', res.status, data, res.ok);
        } catch (err) {
          showResponse('res2', 'res2-status', 'res2-body', 'ERR', { error: err.message }, false);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Đặt lại mật khẩu';
        }
      }
    </script>
  </body>
</html>
