<!DOCTYPE html>
<html>
<head>
    <title>Test Google Login - UNISTAY</title>
</head>
<body>
    <h1>Trình giả lập đăng nhập UNISTAY</h1>
    <p>Bấm nút dưới đây để thấy Consent Screen:</p>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <div id="g_id_onload"
         data-client_id="912862220443-l4g4g561m64m67sfuup7jea7qdj0gg6v.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="signin_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <hr>
    <h3>Kết quả ID Token (Dùng để test API Backend):</h3>
    <textarea id="tokenResult" style="width: 100%; height: 150px;"></textarea>

    <script>
        function handleCredentialResponse(response) {
            // Khi đăng nhập xong, ID Token nằm ở đây
            console.log("Đã nhận ID Token!");
            document.getElementById('tokenResult').value = response.credential;
            
            // Bạn có thể dùng chuỗi này để ném vào Postman test API /api/auth/google
            alert("Đã lấy được Token! Hãy copy trong khung phía dưới để test Backend.");
        }
    </script>
</body>
</html>
