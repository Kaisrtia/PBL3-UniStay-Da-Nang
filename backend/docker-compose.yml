services:
  app:
    build:
      context: .
      target: runtime
    container_name: unistay-backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SERVER_PORT:-6969}:${SERVER_PORT:-6969}'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@db:5432/${DATABASE_NAME:-unistay-db}?schema=public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: build
    profiles:
      - tools
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@db:5432/${DATABASE_NAME:-unistay-db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  db:
    image: postgres:16-alpine
    container_name: unistay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-unistay-db}
    ports:
      - '3005:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: unistay-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '127.0.0.1:5050:80'
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: unistay-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - '3004:6379'
    command:
      - sh
      - -c
      - >
        redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
